<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayFinder - Sign Up</title>
  <link rel="stylesheet" href="SignUp.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <h2>Create your account</h2>
    <form id="signupForm">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="Enter your first name" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Enter your last name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="ex: jon.smith@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-green">SIGN UP</button>
    </form>

    <div class="divider">or sign up with</div>
    <div class="socials">
      <button><img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google"></button>
      <button><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></button>
      <button><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></button>
    </div>

    <div class="signin">
      Already have an account? <a href="SignIn.html">SIGN IN</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await axios.post('/api/auth/signup', {
          firstName,
          lastName,
          email,
          password
        });

        alert(response.data.message);
        if (response.data.userId && response.data.token) {
          // Store token in localStorage
          localStorage.setItem('authToken', response.data.token);
          localStorage.setItem('userId', response.data.userId);

          // Check if there's a redirect URL from query parameters or localStorage
          const urlParams = new URLSearchParams(window.location.search);
          const redirectParam = urlParams.get('redirect');
          const redirectUrl = redirectParam || localStorage.getItem('redirectAfterLogin');

          if (redirectUrl) {
            if (redirectParam) {
              // URL decode the redirect parameter
              const decodedUrl = decodeURIComponent(redirectParam);
              window.location.href = decodedUrl;
            } else {
              localStorage.removeItem('redirectAfterLogin');
              window.location.href = redirectUrl;
            }
          } else {
            // Redirect to home page after successful registration
            window.location.href = 'Home.html';
          }
        }
      } catch (error) {
        alert(error.response?.data?.error || 'Registration failed');
      }
    });
  </script>
</body>
</html>
