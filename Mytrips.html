<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WayFinder - My Trips</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="Mytrips.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/auth.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <div class="logo">WayFinder</div>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="#" id="nav-home">Home</a></li>
        <li><a href="#" id="nav-explore">Explore</a></li>
        <li><a href="#" id="nav-mytrips">My Trips</a></li>
        <li><a href="#" id="nav-profile">Profile</a></li>
      </ul>
      <button class="book-now" data-logout>Logout</button>
    </div>
  </div>

  <!-- Main Content -->
  <main>
    <h1>My Trips</h1>

    <div class="trip-container" id="tripContainer">
      <!-- Trips will be loaded dynamically -->
    </div>

    <button class="plan-new" onclick="planNewTrip()">+ Plan New Trip</button>
  </main>

  <!-- JavaScript Files -->
  <script src="locations.js"></script>
  <script src="trip-manager.js"></script>
  <script>
    // Load trips from localStorage
    function loadMyTrips() {
      const trips = JSON.parse(localStorage.getItem('userTrips') || '[]');
      const container = document.getElementById('tripContainer');

      if (trips.length === 0) {
        container.innerHTML = '<p class="no-trips">No trips planned yet. <a href="#" onclick="planNewTrip()">Explore destinations</a> to add trips!</p>';
        return;
      }

      container.innerHTML = trips.map(trip => `
        <div class="trip-card">
          <div class="trip-card-header">
            <span class="trip-name">${trip.location}</span>
            <span class="status upcoming">Planned</span>
          </div>
          <img src="${trip.image || 'https://via.placeholder.com/300x200'}" class="trip-image" />
          <div class="trip-dates">${trip.date || 'Date TBD'}</div>
          <div class="trip-buttons">
            <button class="view-btn" onclick="viewTripDetails('${trip.location}')"><button class="edit-btn" onclick="editTrip('${trip.location}')"><button class="remove-btn" onclick="removeTrip('${trip.location}')"></div>
        </div>
      `).join('');
    }

    function viewTripDetails(location) {
      if (AuthManager.isAuthenticated()) {
        window.location.href = `/location-details.html?location=${encodeURIComponent(location)}`;
      } else {
        localStorage.setItem('redirectAfterLogin', `/location-details.html?location=${encodeURIComponent(location)}`);
        window.location.href = 'SignIn.html';
      }
    }

    function editTrip(location) {
      // Placeholder for edit functionality
      alert(`Edit trip functionality for ${location} coming soon!`);
    }

    function removeTrip(location) {
      if (confirm(`Remove ${location} from your trips?`)) {
        const trips = JSON.parse(localStorage.getItem('userTrips') || '[]');
        const updatedTrips = trips.filter(trip => trip.location !== location);
        localStorage.setItem('userTrips', JSON.stringify(updatedTrips));
        loadMyTrips(); // Reload the trips
      }
    }

    function planNewTrip() {
      if (AuthManager.isAuthenticated()) {
        window.location.href = '/explore';
      } else {
        localStorage.setItem('redirectAfterLogin', '/explore');
        window.location.href = 'SignIn.html';
      }
    }

    // Add click handlers for navigation links
    document.addEventListener('DOMContentLoaded', function() {
      loadMyTrips(); // Load trips on page load

      // Handle navigation links
      document.getElementById('nav-home').onclick = (e) => {
        e.preventDefault();
        if (AuthManager.isAuthenticated()) {
          window.location.href = '/';
        } else {
          localStorage.setItem('redirectAfterLogin', '/');
          window.location.href = 'SignIn.html';
        }
      };

      document.getElementById('nav-explore').onclick = (e) => {
        e.preventDefault();
        if (AuthManager.isAuthenticated()) {
          window.location.href = '/explore';
        } else {
          localStorage.setItem('redirectAfterLogin', '/explore');
          window.location.href = 'SignIn.html';
        }
      };

      document.getElementById('nav-mytrips').onclick = (e) => {
        e.preventDefault();
        if (AuthManager.isAuthenticated()) {
          loadMyTrips(); // Refresh trips
        } else {
          localStorage.setItem('redirectAfterLogin', '/mytrips');
          window.location.href = 'SignIn.html';
        }
      };

      document.getElementById('nav-profile').onclick = (e) => {
        e.preventDefault();
        if (AuthManager.isAuthenticated()) {
          window.location.href = '/profile';
        } else {
          localStorage.setItem('redirectAfterLogin', '/profile');
          window.location.href = 'SignIn.html';
        }
      };
    });

    // Function to add trip from location details page
    function addToMyTrips(location, image, date) {
      const trips = JSON.parse(localStorage.getItem('userTrips') || '[]');

      // Check if trip already exists
      const existingTrip = trips.find(trip => trip.location === location);
      if (existingTrip) {
        alert(`${location} is already in your trips!`);
        return;
      }

      // Add new trip
      trips.push({
        location: location,
        image: image,
        date: date || 'Date TBD',
        addedDate: new Date().toISOString()
      });

      localStorage.setItem('userTrips', JSON.stringify(trips));
      alert(`${location} added to your trips!`);

      // If on MyTrips page, reload to show new trip
      if (window.location.pathname.includes('mytrips')) {
        loadMyTrips();
      }
    }

    // Make addToMyTrips available globally
    window.addToMyTrips = addToMyTrips;
  </script>
</body>
</html>
